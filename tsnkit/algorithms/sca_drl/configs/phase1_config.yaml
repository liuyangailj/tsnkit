# ============================================
# SCA-DRL Phase 1: GAT 流相似度学习 & 谱聚类分组
# ============================================

seed: 42

data:
  task_file: "data/data_storm/1_task.csv"     # 相对于 sca_drl/
  topo_file: "data/data_storm/1_topo.csv"
  k_paths: 3                                   # 每条流的 K 最短路径数

model:
  input_dim: 3          # 节点特征维度 [size, log(period), log(deadline)]
  hidden_dim: 16        # GAT 隐藏层维度
  output_dim: 16        # 输出 embedding 维度
  heads: 4              # 第一层注意力头数

training:
  learning_rate: 0.005
  n_epochs: 150
  neg_sample_ratio: 0.5               # 负采样数 = 正样本边数 × ratio
  checkpoint_path: "models/phase1_gat.pth"

inference:
  checkpoint_path: "models/phase1_gat.pth"    # 与 training 保持一致
  n_clusters: 4                                # 谱聚类分组数
  alpha: 0.6                                   # W_ij = α·s_gnn + (1-α)·s_prior
  output:
    groups_csv: "results/phase1_groups.csv"
    embeddings_pt: "results/phase1_embeddings.pt"