# ============================================
# SCA-DRL 数据生成配置（单一事实来源）
# 修改此文件后，重新运行 data/data_generater.py 即可
# ============================================

# 输出目录（相对于 sca_drl/，由 resolve_path 解析为绝对路径）
# fig9 旧数据保留不动，fig10 单独存放
data_dir: "data/data_storm/fig10"

topo:
  sw_count: 15
  es_count:  31

# v2 数据集子目录（大流量重训，与 v1 train/val 并列隔离）
train_subdir_v2: "train_v2"
val_subdir_v2:   "val_v2"

task:
  # 训练集：11 档难度 × train_per_n 套/档
  train_flow_pool: [100, 110, 120, 130, 140, 150, 160, 170, 180, 190, 200]
  train_per_n:     50
  # 验证集：固定 N=180
  val_flow_count:  180
  val_count:       50
  # benchmark：7 档（含分布外 N=40/60/250）× benchmark_per_n 套/档
  benchmark_flow_pool: [40, 60, 80, 100, 150, 200, 250]
  benchmark_per_n: 30
  # 共用参数
  period_pool:    [1_000_000, 2_000_000, 4_000_000, 8_000_000] # LCM=8_000_000ns=8000槽
  frame_size_min: 100
  frame_size_max: 1500

# benchmark_v2：与 train_v2 同分布，用于正式评测
# 文件命名与 v2 对齐：{i+1:04d}_task.csv（0001~0030）
# 种子设计：同组内所有 N 档共享同一批种子（小规模7000段，大规模7100段）
benchmark_v2:
  subdir: "benchmark_v2"
  per_n: 30
  small:                                      # 分布内/边界（训练范围内）
    n_pool: [40, 60, 80, 100, 150]
    seed_start: 7000                          # seed 7000~7029
  large:                                      # 分布外（超出训练范围）
    n_pool: [200, 250, 300, 350, 400, 450, 500]
    seed_start: 7100                          # seed 7100~7129

# benchmark_v3：纯随机均匀采样（无核心节点偏置），贴近文献通用 benchmark 标准
# 与 v2 对比：去掉 _CORE_ES 80/20 偏置，全 31 个 ES 均匀采样
# 种子设计：每档独立种子段（与 train_v2 1000段 / val_v2 5000段 / v2 7000段 严格隔离）
benchmark_v3:
  subdir: "benchmark_v3"
  per_n: 30
  n_pool: [40, 60, 80, 100, 150, 200, 250, 300, 350, 400, 450, 500]
  seed_start: 8000                            # N=40:8000~8029, N=60:8030~8059, ..., N=500:8330~8359

# ============================================================
# v4 数据集：均匀随机采样，修正 Phase1/Phase2 路径不一致后的完整重训数据
# 策略：与 benchmark_v3 相同（均匀随机，无核心节点偏置）
# 种子段： 每档独立种子段，且与 v2/v3 完全隔离（train_v4 2000~2359，val_v4 6000~6059，benchmark_v4 9000~9379）
# 结构：Phase1 和 Phase2 共用同一套 train_v4 + val_v4
# ============================================================
train_subdir_v4: "train_v4"
val_subdir_v4:   "val_v4"

v4:
  train:
    n_pool: [280, 320, 360, 400, 440, 480]    # 6档
    per_n: 60                                 # 6档×60=360套
    seed_start: 2000                          # N=280:2000~2059, N=320:2060~2119, ..., N=480:2300~2359
  val:
    n_pool: [320, 400, 480]                   # 3档（训练范围内/边界）
    per_n: 20                                 # 3档×20=60套
    seed_start: 6000                          # N=320:6000~6019, N=400:6020~6039, N=480:6040~6059
   
  benchmark:
    subdir: "benchmark_v4"
    n_pool: [40, 60, 80, 100, 150, 200, 250, 300, 350, 400, 450, 500]  # 12档
    per_n: 30                                 # 12档×30=360套
    seed_start: 9000                          # N=40:9000~9029, N=60:9030~9059, ..., N=500:9350~9379
